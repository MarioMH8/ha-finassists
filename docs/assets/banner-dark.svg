<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="Fin Assist — household finances inside Home Assistant">
	<title>Fin Assist</title>
	<defs>
		<linearGradient id="mark" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#37c8fd" />
			<stop offset="1" stop-color="#009ac7" />
		</linearGradient>
		<radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
			<stop offset="0" stop-color="#18bcf2" stop-opacity="0.32" />
			<stop offset="1" stop-color="#18bcf2" stop-opacity="0" />
		</radialGradient>
		<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
			<path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1" />
		</pattern>
	</defs>

	<rect width="1280" height="420" fill="#0b1013" />
	<rect width="1280" height="420" fill="url(#grid)" />
	<ellipse cx="220" cy="50" rx="520" ry="300" fill="url(#glow)" />
	<ellipse cx="1160" cy="390" rx="400" ry="240" fill="url(#glow)" opacity="0.5" />

	<g transform="translate(64 108)">
		<rect width="80" height="80" rx="24" fill="url(#mark)" />
		<g transform="translate(21 21) scale(1.6)">
			<path fill="#04141b" fill-rule="evenodd" d="M21,18V19A2,2 0 0,1 19,21H5C3.89,21 3,20.1 3,19V5A2,2 0 0,1 5,3H19A2,2 0 0,1 21,5V6H12A2,2 0 0,0 10,8V16A2,2 0 0,0 12,18H21M21,16H13V8H21V16M17,11A1,1 0 0,0 16,12A1,1 0 0,0 17,13A1,1 0 0,0 18,12A1,1 0 0,0 17,11Z" />
		</g>
	</g>

	<text x="168" y="157" font-family="Inter, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="60" font-weight="700" letter-spacing="-1.8" fill="#ffffff">Fin Assist</text>
	<text x="170" y="201" font-family="Inter, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="400" fill="#9db1ba">Household finances, inside Home Assistant.</text>

	<g font-family="Inter, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="500">
		<rect x="170" y="234" width="188" height="40" rx="20" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12" />
		<text x="190" y="260" fill="#cfdde3">Add-on Store</text>
		<rect x="372" y="234" width="172" height="40" rx="20" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12" />
		<text x="392" y="260" fill="#cfdde3">HACS integration</text>
		<rect x="558" y="234" width="122" height="40" rx="20" fill="#18bcf2" fill-opacity="0.12" stroke="#18bcf2" stroke-opacity="0.4" />
		<text x="578" y="260" fill="#7bd4fb">Self-hosted</text>
	</g>

	<g transform="translate(690 76)">
		<rect width="520" height="286" rx="28" fill="#12191d" stroke="#ffffff" stroke-opacity="0.08" />
		<text x="32" y="54" font-family="Inter, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="600" fill="#ffffff">This month</text>
		<text x="32" y="78" font-family="Inter, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8b9aa1">Compared with the previous one</text>

		<g font-family="Inter, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
			<circle cx="36" cy="126" r="5" fill="#4ecb71" />
			<text x="50" y="131" font-size="13" fill="#8b9aa1">Income</text>
			<text x="32" y="168" font-size="24" font-weight="600" fill="#ffffff">€2,824.50</text>

			<circle cx="200" cy="126" r="5" fill="#f4564f" />
			<text x="214" y="131" font-size="13" fill="#8b9aa1">Expenses</text>
			<text x="196" y="168" font-size="24" font-weight="600" fill="#ffffff">€1,747.34</text>

			<circle cx="364" cy="126" r="5" fill="#18bcf2" />
			<text x="378" y="131" font-size="13" fill="#8b9aa1">Net</text>
			<text x="360" y="168" font-size="24" font-weight="600" fill="#ffffff">+€1,077.16</text>

			<rect x="32" y="198" width="456" height="1" fill="#ffffff" fill-opacity="0.08" />

			<text x="32" y="234" font-size="14" fill="#cfdde3">Freelance work</text>
			<text x="456" y="234" font-size="14" font-weight="600" fill="#4ecb71" text-anchor="end">+€350.00</text>
			<text x="32" y="264" font-size="14" fill="#8b9aa1">Groceries</text>
			<text x="456" y="264" font-size="14" font-weight="600" fill="#f4564f" text-anchor="end">-€76.30</text>
		</g>
	</g>
</svg>
