openapi: 3.1.0
info:
  title: Fin Assist REST API
  version: 1.0.0
  description: >-
    Finance API using exact integer minor-unit amounts and ISO calendar dates.
    External finance API clients must send a personal bearer token. Trusted Home
    Assistant Ingress requests are authenticated by the server boundary and
    attributed to the resolved Home Assistant actor; Ingress identity is not an
    HTTP credential clients can forge. The session and personal-token management
    endpoints are restricted to trusted Ingress. The LAN listener is opt-in; do
    not expose it to the public Internet. Configure TLS at a trusted reverse
    proxy if needed.
servers:
  - url: http://{host}:{port}/api/v1
    variables:
      host:
        default: homeassistant.local
      port:
        default: '8099'
security:
  - bearerAuth: []
paths:
  /session:
    get:
      summary: Get the current Home Assistant Ingress actor
      description: Available only through a trusted Home Assistant Ingress connection. An actor without a stable Home Assistant user ID is returned as kind `unknown`.
      security: []
      responses:
        '200':
          description: Resolved Home Assistant actor
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IngressActor' }
        '403': { description: Request did not come from the trusted Supervisor peer }
  /tokens:
    get:
      summary: List the current actor's personal API tokens
      description: Available only through trusted Home Assistant Ingress for an actor with a stable user ID. Token secrets are never returned by this operation.
      security: []
      responses:
        '200':
          description: Token metadata owned by the current actor
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ApiToken' }
        '401': { description: Trusted Ingress request has no stable actor ID }
        '403': { description: Request did not come from the trusted Supervisor peer }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
    post:
      summary: Issue a personal API token
      description: Available only through trusted Home Assistant Ingress for an actor with a stable user ID. The secret is returned once and cannot be retrieved later.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
      responses:
        '201':
          description: Issued token; copy the secret now because it will not be shown again
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssuedApiToken' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { description: Trusted Ingress request has no stable actor ID }
        '403': { description: Request did not come from the trusted Supervisor peer }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
  /tokens/{tokenId}:
    delete:
      summary: Revoke one of the current actor's personal API tokens
      description: Available only through trusted Home Assistant Ingress for an actor with a stable user ID. Tokens owned by other actors are not visible or revocable.
      security: []
      parameters:
        - { $ref: '#/components/parameters/tokenId' }
      responses:
        '204': { description: Token revoked }
        '401': { description: Trusted Ingress request has no stable actor ID }
        '403': { description: Request did not come from the trusted Supervisor peer }
        '404': { description: Token does not exist or is not owned by the current actor }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
  /system-credentials/exchange:
    post:
      summary: Exchange a one-time bootstrap capability for the Home Assistant integration credential
      description: The capability must be configured in the backend as SYSTEM_CREDENTIAL_BOOTSTRAP_CAPABILITY. It expires 15 minutes after server startup and can be redeemed only once. Neither the capability nor the issued credential is stored in plaintext or returned again.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [bootstrapCapability]
              properties:
                bootstrapCapability: { type: string, minLength: 32, maxLength: 4096 }
      responses:
        '201':
          description: System credential issued; store it securely because it is returned only once
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssuedSystemCredential' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { description: Bootstrap capability is invalid, expired, or already redeemed }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '503': { description: No bootstrap capability is configured }
  /system-credentials/current:
    put:
      summary: Rotate the current Home Assistant integration credential
      description: Requires the current system credential. Personal user API tokens and trusted Ingress identity cannot rotate this credential. Rotation atomically invalidates the old credential and returns the new one only once.
      security:
        - systemCredentialAuth: []
      responses:
        '200':
          description: Rotated credential; securely replace the stored credential immediately
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssuedSystemCredential' }
        '401': { description: Current system credential is missing or invalid }
        '404': { description: System credential lifecycle is unavailable }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
    delete:
      summary: Revoke the current Home Assistant integration credential
      description: Requires the current system credential. Personal user API tokens and trusted Ingress identity cannot revoke this credential. Revocation is idempotent only for an existing credential; a missing credential returns 404.
      security:
        - systemCredentialAuth: []
      responses:
        '204': { description: System credential revoked }
        '401': { description: Current system credential is missing or invalid }
        '404': { description: No current system credential exists or lifecycle is unavailable }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
  /books:
    get:
      summary: List books
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: Paginated books
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookPage'
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      summary: Create a book
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currencyCode, name]
              properties:
                currencyCode: { type: string, pattern: '^[A-Z]{3}$' }
                name: { type: string, minLength: 1, maxLength: 80 }
      responses:
        '201':
          description: Created book
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Book' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /books/{bookId}:
    delete:
      summary: Delete an empty book
      parameters: [{ $ref: '#/components/parameters/bookId' }]
      responses:
        '204': { description: Deleted }
        '409': { $ref: '#/components/responses/Conflict' }
  /books/{bookId}/archive:
    post:
      summary: Archive a book
      parameters: [{ $ref: '#/components/parameters/bookId' }]
      responses:
        '204': { description: Archived }
        '404': { $ref: '#/components/responses/NotFound' }
  /books/{bookId}/accounts:
    get:
      summary: List accounts
      parameters:
        - { $ref: '#/components/parameters/bookId' }
        - { $ref: '#/components/parameters/limit' }
        - { $ref: '#/components/parameters/offset' }
        - name: includeClosed
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Paginated accounts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountPage' }
    post:
      summary: Create an account
      parameters: [{ $ref: '#/components/parameters/bookId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, name, openingBalanceMinor]
              properties:
                kind: { type: string, enum: [checking, savings, credit, asset, liability] }
                name: { type: string, minLength: 1, maxLength: 80 }
                openingBalanceMinor: { type: integer, minimum: -9007199254740991, maximum: 9007199254740991 }
      responses:
        '201': { description: Created account, content: { application/json: { schema: { $ref: '#/components/schemas/Account' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
  /books/{bookId}/accounts/{accountId}/balances:
    get:
      summary: Get exact account balances
      parameters:
        - { $ref: '#/components/parameters/bookId' }
        - { $ref: '#/components/parameters/accountId' }
        - name: asOf
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: Balances in integer minor units
          content:
            application/json:
              schema:
                type: object
                required: [totalMinor, postedMinor, reconciledMinor]
                properties:
                  totalMinor: { type: integer }
                  postedMinor: { type: integer }
                  reconciledMinor: { type: integer }
        '404': { $ref: '#/components/responses/NotFound' }
  /books/{bookId}/accounts/{accountId}/open:
    post:
      summary: Reopen a closed account
      parameters:
        - { $ref: '#/components/parameters/bookId' }
        - { $ref: '#/components/parameters/accountId' }
      responses:
        '204': { description: Reopened }
        '404': { $ref: '#/components/responses/NotFound' }
  /books/{bookId}/accounts/{accountId}/close:
    post:
      summary: Close an account without deleting its ledger
      parameters:
        - { $ref: '#/components/parameters/bookId' }
        - { $ref: '#/components/parameters/accountId' }
      responses:
        '204': { description: Closed }
        '404': { $ref: '#/components/responses/NotFound' }
  /books/{bookId}/categories:
    get:
      summary: List categories
      parameters:
        - { $ref: '#/components/parameters/bookId' }
        - { $ref: '#/components/parameters/limit' }
        - { $ref: '#/components/parameters/offset' }
        - { name: includeArchived, in: query, schema: { type: boolean, default: false } }
      responses:
        '200': { description: Paginated categories, content: { application/json: { schema: { $ref: '#/components/schemas/ClassificationPage' } } } }
    post:
      summary: Create a category
      parameters: [{ $ref: '#/components/parameters/bookId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClassificationInput' }
      responses:
        '201': { description: Created category, content: { application/json: { schema: { $ref: '#/components/schemas/Classification' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /books/{bookId}/categories/{classificationId}:
    patch:
      summary: Update a category name or parent
      parameters:
        - { $ref: '#/components/parameters/bookId' }
        - { $ref: '#/components/parameters/classificationId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClassificationUpdate' }
      responses:
        '200': { description: Updated category, content: { application/json: { schema: { $ref: '#/components/schemas/Classification' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      summary: Delete an unused category
      parameters:
        - { $ref: '#/components/parameters/bookId' }
        - { $ref: '#/components/parameters/classificationId' }
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /books/{bookId}/categories/{classificationId}/archive:
    post:
      summary: Archive a category hierarchy
      parameters:
        - { $ref: '#/components/parameters/bookId' }
        - { $ref: '#/components/parameters/classificationId' }
      responses:
        '200': { description: Archived category hierarchy, content: { application/json: { schema: { type: object } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /books/{bookId}/categories/{classificationId}/restore:
    post:
      summary: Restore a category hierarchy
      parameters:
        - { $ref: '#/components/parameters/bookId' }
        - { $ref: '#/components/parameters/classificationId' }
      responses:
        '200': { description: Restored category hierarchy, content: { application/json: { schema: { type: object } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /books/{bookId}/classes:
    get:
      summary: List classes
      parameters:
        - { $ref: '#/components/parameters/bookId' }
        - { $ref: '#/components/parameters/limit' }
        - { $ref: '#/components/parameters/offset' }
        - { name: includeArchived, in: query, schema: { type: boolean, default: false } }
      responses:
        '200': { description: Paginated classes, content: { application/json: { schema: { $ref: '#/components/schemas/ClassificationPage' } } } }
    post:
      summary: Create a class
      parameters: [{ $ref: '#/components/parameters/bookId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClassificationInput' }
      responses:
        '201': { description: Created class, content: { application/json: { schema: { $ref: '#/components/schemas/Classification' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /books/{bookId}/classes/{classificationId}:
    patch:
      summary: Update a class name or parent
      parameters:
        - { $ref: '#/components/parameters/bookId' }
        - { $ref: '#/components/parameters/classificationId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClassificationUpdate' }
      responses:
        '200': { description: Updated class, content: { application/json: { schema: { $ref: '#/components/schemas/Classification' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      summary: Delete an unused class
      parameters:
        - { $ref: '#/components/parameters/bookId' }
        - { $ref: '#/components/parameters/classificationId' }
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /books/{bookId}/classes/{classificationId}/archive:
    post:
      summary: Archive a class hierarchy
      parameters:
        - { $ref: '#/components/parameters/bookId' }
        - { $ref: '#/components/parameters/classificationId' }
      responses:
        '200': { description: Archived class hierarchy, content: { application/json: { schema: { type: object } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /books/{bookId}/classes/{classificationId}/restore:
    post:
      summary: Restore a class hierarchy
      parameters:
        - { $ref: '#/components/parameters/bookId' }
        - { $ref: '#/components/parameters/classificationId' }
      responses:
        '200': { description: Restored class hierarchy, content: { application/json: { schema: { type: object } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /books/{bookId}/transactions:
    get:
      summary: List transactions for one account
      parameters:
        - { $ref: '#/components/parameters/bookId' }
        - { $ref: '#/components/parameters/limit' }
        - { $ref: '#/components/parameters/offset' }
        - { name: accountId, in: query, required: true, schema: { type: string } }
        - { name: fromDate, in: query, schema: { type: string, format: date } }
        - { name: toDate, in: query, schema: { type: string, format: date } }
        - { name: status, in: query, schema: { type: string, enum: [uncleared, cleared, reconciled] } }
      responses:
        '200': { description: Paginated transactions, content: { application/json: { schema: { $ref: '#/components/schemas/TransactionPage' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      summary: Create a transaction
      parameters: [{ $ref: '#/components/parameters/bookId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransactionInput' }
      responses:
        '201': { description: Created transaction, content: { application/json: { schema: { $ref: '#/components/schemas/Transaction' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /books/{bookId}/transfers:
    post:
      summary: Create a paired transfer
      parameters: [{ $ref: '#/components/parameters/bookId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amountMinor, fromAccountId, toAccountId, transactionDate]
              properties:
                amountMinor: { type: integer, minimum: 1 }
                fromAccountId: { type: string }
                toAccountId: { type: string }
                transactionDate: { type: string, format: date }
                memo: { type: string }
      responses:
        '201':
          description: Created transfer identifier and its paired ledger legs
          content:
            application/json:
              schema:
                type: object
                required: [id, from, to]
                properties:
                  id: { type: string }
                  from: { $ref: '#/components/schemas/Transaction' }
                  to: { $ref: '#/components/schemas/Transaction' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /books/{bookId}/transactions/{transactionId}:
    patch:
      summary: Update a non-reconciled transaction
      parameters:
        - { $ref: '#/components/parameters/bookId' }
        - { $ref: '#/components/parameters/transactionId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransactionUpdate' }
      responses:
        '200': { description: Updated transaction, content: { application/json: { schema: { $ref: '#/components/schemas/Transaction' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      summary: Delete a non-reconciled transaction
      parameters:
        - { $ref: '#/components/parameters/bookId' }
        - { $ref: '#/components/parameters/transactionId' }
      responses:
        '204': { description: Deleted }
        '409': { $ref: '#/components/responses/Conflict' }
  /books/{bookId}/transactions/{transactionId}/status:
    put:
      summary: Change transaction status
      parameters:
        - { $ref: '#/components/parameters/bookId' }
        - { $ref: '#/components/parameters/transactionId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [uncleared, cleared, reconciled] }
      responses:
        '204': { description: Status changed }
        '409': { $ref: '#/components/responses/Conflict' }
  /books/{bookId}/budgets:
    get:
      summary: List budgets for a book, optionally scoped to an account
      parameters:
        - { $ref: '#/components/parameters/bookId' }
        - { name: accountId, in: query, schema: { type: string } }
        - { $ref: '#/components/parameters/limit' }
        - { $ref: '#/components/parameters/offset' }
      responses:
        '200': { description: Paginated budgets, content: { application/json: { schema: { $ref: '#/components/schemas/BudgetPage' } } } }
    post:
      summary: Create a budget
      parameters: [{ $ref: '#/components/parameters/bookId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BudgetInput' }
      responses:
        '201': { description: Created budget, content: { application/json: { schema: { $ref: '#/components/schemas/Budget' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /books/{bookId}/budgets/{budgetId}/report:
    get:
      summary: Get a budget report
      parameters:
        - { $ref: '#/components/parameters/bookId' }
        - { name: budgetId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Planned, actual, and remaining amounts, content: { application/json: { schema: { $ref: '#/components/schemas/BudgetReport' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /books/{bookId}/schedules:
    get:
      summary: List scheduled payments
      parameters:
        - { $ref: '#/components/parameters/bookId' }
        - { $ref: '#/components/parameters/limit' }
        - { $ref: '#/components/parameters/offset' }
      responses:
        '200': { description: Paginated schedules, content: { application/json: { schema: { $ref: '#/components/schemas/SchedulePage' } } } }
    post:
      summary: Create a scheduled payment without posting ledger transactions
      parameters: [{ $ref: '#/components/parameters/bookId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduleInput' }
      responses:
        '201': { description: Created schedule, content: { application/json: { schema: { $ref: '#/components/schemas/ScheduledPayment' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /books/{bookId}/schedules/{scheduleId}:
    patch:
      summary: Update scheduled payment details
      parameters:
        - { $ref: '#/components/parameters/bookId' }
        - { name: scheduleId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduleUpdate' }
      responses:
        '200': { description: Updated schedule, content: { application/json: { schema: { $ref: '#/components/schemas/ScheduledPayment' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /books/{bookId}/schedules/{scheduleId}/status:
    put:
      summary: Pause, resume, or cancel a scheduled payment
      parameters:
        - { $ref: '#/components/parameters/bookId' }
        - { name: scheduleId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [active, paused, canceled] }
      responses:
        '200': { description: Updated status, content: { application/json: { schema: { $ref: '#/components/schemas/ScheduledPayment' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /books/{bookId}/schedules/{scheduleId}/occurrences:
    get:
      summary: List persisted forecast occurrences for a scheduled payment
      parameters:
        - { $ref: '#/components/parameters/bookId' }
        - { name: scheduleId, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/limit' }
        - { $ref: '#/components/parameters/offset' }
      responses:
        '200': { description: Paginated forecast occurrences, content: { application/json: { schema: { $ref: '#/components/schemas/ScheduleOccurrencePage' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      summary: Generate bounded forecast occurrences without posting ledger transactions
      parameters:
        - { $ref: '#/components/parameters/bookId' }
        - { name: scheduleId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [throughDate]
              properties:
                throughDate: { type: string, format: date }
                maxOccurrences: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        '200': { description: Generated forecast occurrences, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ScheduleOccurrence' } } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /books/{bookId}/schedule-occurrences/{occurrenceId}/record:
    post:
      summary: Link an occurrence to an existing matching ledger transaction; this does not create one
      parameters:
        - { $ref: '#/components/parameters/bookId' }
        - { name: occurrenceId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [transactionId]
              properties:
                transactionId: { type: string }
      responses:
        '200': { description: Recorded occurrence, content: { application/json: { schema: { $ref: '#/components/schemas/ScheduleOccurrence' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /books/{bookId}/shared-expense-participants:
    get:
      summary: List participants
      parameters:
        - { $ref: '#/components/parameters/bookId' }
        - { name: includeRemoved, in: query, schema: { type: boolean, default: false } }
        - { $ref: '#/components/parameters/limit' }
        - { $ref: '#/components/parameters/offset' }
      responses:
        '200': { description: Paginated participants, content: { application/json: { schema: { $ref: '#/components/schemas/SharedExpenseParticipantPage' } } } }
    post:
      summary: Create a participant identity
      parameters: [{ $ref: '#/components/parameters/bookId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, name]
              properties:
                id: { type: string, minLength: 1 }
                name: { type: string, minLength: 1, maxLength: 120 }
      responses:
        '201': { description: Created participant, content: { application/json: { schema: { $ref: '#/components/schemas/SharedExpenseParticipant' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /books/{bookId}/shared-expense-participants/{participantId}/remove:
    post:
      summary: Soft-remove a participant while preserving historical allocations
      parameters:
        - { $ref: '#/components/parameters/bookId' }
        - { name: participantId, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Participant removed }
        '404': { $ref: '#/components/responses/NotFound' }
  /books/{bookId}/shared-expenses:
    get:
      summary: List shared expenses and settlement status
      parameters:
        - { $ref: '#/components/parameters/bookId' }
        - { name: includeClosed, in: query, schema: { type: boolean, default: false } }
        - { $ref: '#/components/parameters/limit' }
        - { $ref: '#/components/parameters/offset' }
      responses:
        '200': { description: Paginated shared expenses, content: { application/json: { schema: { $ref: '#/components/schemas/SharedExpensePage' } } } }
    post:
      summary: Create a shared expense with equal, exact-minor-unit allocations
      parameters: [{ $ref: '#/components/parameters/bookId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amountMinor, description, participantIds]
              properties:
                amountMinor: { type: integer, minimum: 1 }
                description: { type: string, minLength: 1, maxLength: 200 }
                participantIds: { type: array, minItems: 1, uniqueItems: true, items: { type: string } }
      responses:
        '201': { description: Created expense, content: { application/json: { schema: { $ref: '#/components/schemas/SharedExpense' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /books/{bookId}/shared-expenses/{expenseId}/close:
    post:
      summary: Close a shared expense to further settlements
      parameters:
        - { $ref: '#/components/parameters/bookId' }
        - { name: expenseId, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Expense closed }
        '404': { $ref: '#/components/responses/NotFound' }
  /books/{bookId}/shared-expenses/{expenseId}/reopen:
    post:
      summary: Reopen a closed shared expense
      parameters:
        - { $ref: '#/components/parameters/bookId' }
        - { name: expenseId, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Expense reopened }
        '404': { $ref: '#/components/responses/NotFound' }
  /books/{bookId}/shared-expenses/{expenseId}/settle:
    post:
      summary: Record a participant settlement separately from ledger transactions
      parameters:
        - { $ref: '#/components/parameters/bookId' }
        - { name: expenseId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [participantId]
              properties:
                participantId: { type: string }
      responses:
        '204': { description: Settlement recorded }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /books/{bookId}/imports/{action}:
    post:
      summary: Preview or commit a statement import
      parameters:
        - { $ref: '#/components/parameters/bookId' }
        - name: action
          in: path
          required: true
          schema: { type: string, enum: [preview, commit] }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [accountId, format, file]
              properties:
                accountId: { type: string }
                format: { type: string, enum: [qif, payee_csv, statement_csv] }
                file: { type: string, format: binary, description: Maximum 2 MiB }
                payeeDirectory: { type: string, format: binary, description: Optional payee CSV, maximum 2 MiB }
      responses:
        '200': { description: Import preview (action=preview), content: { application/json: { schema: { $ref: '#/components/schemas/ImportPreview' } } } }
        '201': { description: Import result (action=commit), content: { application/json: { schema: { $ref: '#/components/schemas/ImportCommitResult' } } } }
        '400': { $ref: '#/components/responses/ImportProblem' }
        '404': { $ref: '#/components/responses/ImportProblem' }
        '409': { $ref: '#/components/responses/ImportProblem' }
        '413': { $ref: '#/components/responses/ImportProblem' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Fin Assist personal API token
    systemCredentialAuth:
      type: http
      scheme: bearer
      bearerFormat: Fin Assist Home Assistant system credential
  parameters:
    bookId:
      name: bookId
      in: path
      required: true
      schema: { type: string }
    accountId:
      name: accountId
      in: path
      required: true
      schema: { type: string }
    classificationId:
      name: classificationId
      in: path
      required: true
      schema: { type: string }
    transactionId:
      name: transactionId
      in: path
      required: true
      schema: { type: string }
    tokenId:
      name: tokenId
      in: path
      required: true
      schema: { type: string }
    limit:
      name: limit
      in: query
      description: Page size; defaults to 100 and is capped at 100.
      schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
    offset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
  schemas:
    Page:
      type: object
      required: [items, limit, offset, total]
      properties:
        items: { type: array, items: {} }
        limit: { type: integer }
        offset: { type: integer }
        total: { type: integer }
    IngressActor:
      oneOf:
        - type: object
          required: [kind]
          properties:
            kind: { const: unknown }
        - type: object
          required: [id, kind]
          properties:
            id: { type: string }
            kind: { const: home_assistant_user }
            username: { type: string }
            displayName: { type: string }
        - type: object
          required: [id, kind]
          properties:
            id: { type: string }
            kind: { const: home_assistant_integration }
    SystemCredential:
      type: object
      required: [id, prefix, createdAt]
      properties:
        id: { type: string, const: home-assistant-integration }
        prefix: { type: string, pattern: '^fa_system_' }
        createdAt: { type: string, format: date-time }
    IssuedSystemCredential:
      type: object
      required: [credential, id]
      properties:
        credential: { type: string, pattern: '^fa_system_', description: Bearer secret returned only at exchange or rotation; never retrievable later }
        id: { type: string, const: home-assistant-integration }
    ApiToken:
      type: object
      required: [createdAt, id, name, prefix]
      properties:
        createdAt: { type: string, format: date-time }
        id: { type: string }
        name: { type: string }
        prefix: { type: string }
    IssuedApiToken:
      allOf:
        - $ref: '#/components/schemas/ApiToken'
        - type: object
          required: [secret]
          properties:
            secret: { type: string, description: Returned once at issuance; cannot be retrieved later }
    Book:
      type: object
      required: [id, name, currencyCode, isDefault, archivedAt, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        currencyCode: { type: string, pattern: '^[A-Z]{3}$' }
        isDefault: { type: boolean }
        archivedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
    Account:
      type: object
      required: [id, bookId, name, kind, openingBalanceMinor, closedAt, createdAt]
      properties:
        id: { type: string }
        bookId: { type: string }
        name: { type: string }
        kind: { type: string, enum: [checking, savings, credit, asset, liability] }
        openingBalanceMinor: { type: integer }
        closedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
    ClassificationInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        parentId: { type: [string, 'null'] }
    Classification:
      type: object
      required: [id, bookId, name, parentId, archivedAt]
      properties:
        id: { type: string }
        bookId: { type: string }
        name: { type: string }
        parentId: { type: [string, 'null'] }
        archivedAt: { type: [string, 'null'], format: date-time }
    ClassificationUpdate:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        parentId: { type: [string, 'null'] }
    TransactionPartInput:
      type: object
      required: [amountMinor]
      properties:
        amountMinor: { type: integer, minimum: -9007199254740991, maximum: 9007199254740991 }
        categoryId: { type: [string, 'null'] }
        classId: { type: [string, 'null'] }
        memo: { type: string, maxLength: 500 }
    TransactionPart:
      allOf:
        - $ref: '#/components/schemas/TransactionPartInput'
        - type: object
          required: [id, categoryId, classId, memo]
          properties:
            id: { type: string }
            categoryId: { type: [string, 'null'] }
            classId: { type: [string, 'null'] }
            memo: { type: string }
    TransactionInput:
      type: object
      required: [accountId, amountMinor, transactionDate]
      properties:
        accountId: { type: string }
        amountMinor: { type: integer, minimum: -9007199254740991, maximum: 9007199254740991 }
        transactionDate: { type: string, format: date }
        payee: { type: string, maxLength: 120 }
        memo: { type: string, maxLength: 500 }
        parts: { type: array, items: { $ref: '#/components/schemas/TransactionPartInput' } }
    TransactionUpdate:
      type: object
      properties:
        accountId: { type: string }
        amountMinor: { type: integer }
        transactionDate: { type: string, format: date }
        payee: { type: string, maxLength: 120 }
        memo: { type: string, maxLength: 500 }
        parts: { type: array, items: { $ref: '#/components/schemas/TransactionPartInput' } }
    Transaction:
      type: object
      required: [id, bookId, accountId, amountMinor, transactionDate, status, actorId, memo, payee, parts, transferId]
      properties:
        id: { type: string }
        bookId: { type: string }
        accountId: { type: string }
        amountMinor: { type: integer, minimum: -9007199254740991, maximum: 9007199254740991 }
        transactionDate: { type: string, format: date }
        status: { type: string, enum: [uncleared, cleared, reconciled] }
        actorId: { type: [string, 'null'] }
        memo: { type: string }
        payee: { type: string }
        parts: { type: array, items: { $ref: '#/components/schemas/TransactionPart' } }
        transferId: { type: [string, 'null'] }
    BudgetInput:
      type: object
      required: [accountId, name, periodEnd, periodStart, plannedMinor]
      properties:
        accountId: { type: string }
        categoryId: { type: [string, 'null'] }
        classId: { type: [string, 'null'] }
        name: { type: string, minLength: 1, maxLength: 80 }
        periodEnd: { type: string, format: date }
        periodStart: { type: string, format: date }
        plannedMinor: { type: integer, minimum: 0, maximum: 9007199254740991 }
    Budget:
      type: object
      required: [accountId, bookId, categoryId, classId, currencyCode, id, name, periodEnd, periodStart, plannedMinor]
      properties:
        accountId: { type: string }
        bookId: { type: string }
        categoryId: { type: [string, 'null'] }
        classId: { type: [string, 'null'] }
        currencyCode: { type: string, pattern: '^[A-Z]{3}$' }
        id: { type: string }
        name: { type: string }
        periodEnd: { type: string, format: date }
        periodStart: { type: string, format: date }
        plannedMinor: { type: integer }
    BudgetReport:
      type: object
      required: [actualMinor, budget, remainingMinor]
      properties:
        actualMinor: { type: integer }
        budget: { $ref: '#/components/schemas/Budget' }
        remainingMinor: { type: integer }
    ScheduleInput:
      type: object
      required: [accountId, amountMinor, frequency, startDate]
      properties:
        accountId: { type: string }
        amountMinor: { type: integer, minimum: -9007199254740991, maximum: 9007199254740991, not: { const: 0 } }
        endDate: { type: string, format: date }
        frequency: { type: string, enum: [one_time, daily, weekly, monthly, quarterly, yearly] }
        interval: { type: integer, minimum: 1 }
        memo: { type: string, maxLength: 500 }
        occurrenceLimit: { type: integer, minimum: 1 }
        payee: { type: string, maxLength: 120 }
        startDate: { type: string, format: date }
    ScheduleUpdate:
      type: object
      minProperties: 1
      properties:
        amountMinor: { type: integer, minimum: -9007199254740991, maximum: 9007199254740991, not: { const: 0 } }
        endDate: { type: string, format: date }
        memo: { type: string, maxLength: 500 }
        occurrenceLimit: { type: integer, minimum: 1 }
        payee: { type: string, maxLength: 120 }
    ScheduledPayment:
      type: object
      required: [accountId, amountMinor, bookId, createdAt, frequency, id, interval, memo, payee, startDate, status]
      properties:
        accountId: { type: string }
        amountMinor: { type: integer }
        bookId: { type: string }
        createdAt: { type: string, format: date-time }
        endDate: { type: string, format: date }
        frequency: { type: string, enum: [one_time, daily, weekly, monthly, quarterly, yearly] }
        id: { type: string }
        interval: { type: integer, minimum: 1 }
        memo: { type: string }
        occurrenceLimit: { type: integer, minimum: 1 }
        payee: { type: string }
        startDate: { type: string, format: date }
        status: { type: string, enum: [active, paused, canceled, completed] }
    ScheduleOccurrence:
      type: object
      required: [accountId, amountMinor, bookId, createdAt, dueDate, id, memo, occurrenceNumber, payee, scheduleId, status]
      properties:
        accountId: { type: string }
        amountMinor: { type: integer }
        bookId: { type: string }
        createdAt: { type: string, format: date-time }
        dueDate: { type: string, format: date }
        id: { type: string }
        memo: { type: string }
        occurrenceNumber: { type: integer, minimum: 0 }
        payee: { type: string }
        recordedAt: { type: string, format: date-time }
        scheduleId: { type: string }
        status: { type: string, enum: [pending, recorded, skipped] }
        transactionId: { type: string }
    SharedExpenseParticipant:
      type: object
      required: [bookId, createdAt, id, name]
      properties:
        bookId: { type: string }
        createdAt: { type: string, format: date-time }
        id: { type: string }
        name: { type: string }
        removedAt: { type: string, format: date-time }
    SharedExpenseActor:
      oneOf:
        - type: object
          required: [kind]
          properties:
            kind: { const: unknown }
        - type: object
          required: [id, kind]
          properties:
            id: { type: string }
            kind: { const: home_assistant_user }
    SharedExpenseAllocation:
      type: object
      required: [amountMinor, participantId, participantName]
      properties:
        amountMinor: { type: integer, minimum: 0 }
        participantId: { type: string }
        participantName: { type: string }
    SharedExpenseSettlement:
      type: object
      required: [amountMinor, participantId, status]
      properties:
        amountMinor: { type: integer, minimum: 0 }
        participantId: { type: string }
        settledAt: { type: string, format: date-time }
        settledByActor: { $ref: '#/components/schemas/SharedExpenseActor' }
        status: { type: string, enum: [pending, settled] }
    SharedExpense:
      type: object
      required: [actor, allocations, amountMinor, bookId, createdAt, description, id, settlements]
      properties:
        actor: { $ref: '#/components/schemas/SharedExpenseActor' }
        allocations: { type: array, items: { $ref: '#/components/schemas/SharedExpenseAllocation' } }
        amountMinor: { type: integer, minimum: 1 }
        bookId: { type: string }
        closedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        description: { type: string }
        id: { type: string }
        settlements: { type: array, items: { $ref: '#/components/schemas/SharedExpenseSettlement' } }
    BudgetPage:
      allOf:
        - { $ref: '#/components/schemas/Page' }
        - type: object
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/Budget' } }
    SchedulePage:
      allOf:
        - { $ref: '#/components/schemas/Page' }
        - type: object
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/ScheduledPayment' } }
    ScheduleOccurrencePage:
      allOf:
        - { $ref: '#/components/schemas/Page' }
        - type: object
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/ScheduleOccurrence' } }
    SharedExpenseParticipantPage:
      allOf:
        - { $ref: '#/components/schemas/Page' }
        - type: object
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/SharedExpenseParticipant' } }
    SharedExpensePage:
      allOf:
        - { $ref: '#/components/schemas/Page' }
        - type: object
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/SharedExpense' } }
    ImportProblem:
      type: object
      required: [error]
      properties:
        action: { type: string }
        code: { type: string }
        error: { type: string }
        line: { type: [integer, 'null'] }
        issues: { type: array, items: { $ref: '#/components/schemas/ImportIssue' } }
    ImportIssue:
      type: object
      required: [code, line, message, severity]
      properties:
        code: { type: string }
        line: { type: integer }
        message: { type: string }
        severity: { type: string, enum: [error, warning] }
    StatementImportRecord:
      type: object
      required: [accountId, bookId, contentHash, format, id, importedAt]
      properties:
        accountId: { type: string }
        bookId: { type: string }
        contentHash: { type: string }
        format: { type: string, enum: [qif, payee_csv, statement_csv] }
        id: { type: string }
        importedAt: { type: string, format: date-time }
    PayeeDirectoryEntry:
      type: object
      required: [active, code, line, name]
      properties:
        active: { type: boolean }
        code: { type: string }
        line: { type: integer }
        name: { type: string }
    ImportPreview:
      type: object
      required: [accountId, bookId, canCommit, contentHash, currencyCode, errorCount, existingImport, format, ignoredFields, issues, payeeDirectory, payeesNormalized, rows, summary, warningCount]
      properties:
        accountId: { type: string }
        bookId: { type: string }
        canCommit: { type: boolean }
        contentHash: { type: string }
        currencyCode: { type: string }
        errorCount: { type: integer }
        existingImport: { oneOf: [{ $ref: '#/components/schemas/StatementImportRecord' }, { type: 'null' }] }
        format: { type: string, enum: [qif, payee_csv, statement_csv] }
        ignoredFields: { type: object, additionalProperties: { type: integer } }
        issues: { type: array, items: { $ref: '#/components/schemas/ImportIssue' } }
        payeeDirectory: { type: array, items: { $ref: '#/components/schemas/PayeeDirectoryEntry' } }
        payeesNormalized: { type: integer }
        rows:
          type: array
          items:
            type: object
            required: [amountMinor, line, memo, payee, possibleDuplicate, transactionDate]
            properties:
              amountMinor: { type: integer }
              line: { type: integer }
              memo: { type: string }
              payee: { type: string }
              possibleDuplicate: { type: boolean }
              transactionDate: { type: string, format: date }
        summary:
          type: object
          required: [firstDate, lastDate, rowCount, totalMinor]
          properties:
            firstDate: { type: [string, 'null'], format: date }
            lastDate: { type: [string, 'null'], format: date }
            rowCount: { type: integer }
            totalMinor: { type: integer }
        warningCount: { type: integer }
    ImportCommitResult:
      type: object
      required: [importId, importedAt, status, transactionIds]
      properties:
        importId: { type: string }
        importedAt: { type: string, format: date-time }
        status: { type: string, enum: [already-imported, imported] }
        transactionIds: { type: array, items: { type: string } }
    BookPage:
      allOf:
        - { $ref: '#/components/schemas/Page' }
        - type: object
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/Book' } }
    AccountPage:
      allOf:
        - { $ref: '#/components/schemas/Page' }
        - type: object
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/Account' } }
    ClassificationPage:
      allOf:
        - { $ref: '#/components/schemas/Page' }
        - type: object
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/Classification' } }
    TransactionPage:
      allOf:
        - { $ref: '#/components/schemas/Page' }
        - type: object
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/Transaction' } }
  responses:
    ImportProblem:
      description: Import validation or processing error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ImportProblem' }
    MethodNotAllowed:
      description: HTTP method is not supported for this route
      headers:
        Allow:
          schema: { type: string }
    BadRequest:
      description: Invalid request parameters or body
      content:
        application/json:
          schema: { type: object, properties: { error: { type: string } } }
    NotFound:
      description: Resource not found in the selected book
      content:
        application/json:
          schema: { type: object, properties: { error: { type: string } } }
    Conflict:
      description: Request conflicts with existing financial state
      content:
        application/json:
          schema: { type: object, properties: { error: { type: string } } }
