<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#03a9f4" />
    <title>Fin Assist</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./main.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <div class="brand-mark" aria-hidden="true">F</div>
        <h1 data-i18n="title">Fin Assist</h1>
      </header>
      <main class="main-content">
        <section class="welcome-card" aria-labelledby="welcome-title">
          <div class="eyebrow" data-i18n="eyebrow">Home Assistant add-on</div>
          <h2 id="welcome-title" data-i18n="welcome">Your financial workspace starts here</h2>
          <p data-i18n="description">
            The application scaffold is ready. Accounts, transactions, and the rest of your
            household-finance tools will be built here.
          </p>
          <div class="service-status" role="status" aria-live="polite">
            <span class="status-indicator" aria-hidden="true"></span>
            <span data-status data-i18n="checking">Checking service status…</span>
          </div>
        </section>
        <footer data-i18n="footer">Private by design. Runs on your Home Assistant instance.</footer>
      </main>
    </div>
  </body>
</html>
