name: Release

# Publishing is driven by the version in ha-finassists/config.yaml: a push that changes it
# builds and publishes the app image first, and only then creates the tag and
# the GitHub release that HACS, the Marketplace and the Supervisor consume.
on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  detect:
    name: Detect a version change
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Detect a version change
        id: detect
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -z "${BEFORE}" ] || [ "${BEFORE}" = "0000000000000000000000000000000000000000" ]; then
            echo "No previous commit to compare: releasing."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! changes="$(git diff --unified=0 "${BEFORE}" "${GITHUB_SHA}" -- ha-finassists/config.yaml)"; then
            echo "::warning::Cannot compare with ${BEFORE}: releasing anyway."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if grep -q '^[+-]version:' <<< "${changes}"; then
            echo "The app version changed in this push."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "changed=false" >> "$GITHUB_OUTPUT"

  image:
    name: App image
    needs: detect
    if: ${{ needs.detect.outputs.changed == 'true' }}
    permissions:
      contents: read
      id-token: write
      packages: write
    uses: ./.github/workflows/app-image.yml

  tag:
    name: Tag and release
    needs: [detect, image]
    if: ${{ !cancelled() && needs.detect.outputs.changed == 'true' && needs.image.result == 'success' }}
    permissions:
      contents: write
      id-token: write
      issues: write
      pull-requests: write
    uses: hexadrop/github-workflows/.github/workflows/release.yml@v1.7.4
    with:
      target: tags
      concurrency-group: release-main
      package-json-path: ha-finassists/package.json
