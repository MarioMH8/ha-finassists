name: "Release: prepare"

on:
  push:
    branches: [main]

concurrency:
  # The called workflow serializes itself on `release-prepare`, so the caller must
  # not reuse that group.
  group: release-prepare-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: Check
    uses: hexadrop/github-workflows/.github/workflows/check.yml@v1.7.2
    with:
      commands: '["lint:ci", "typecheck", "test", "check:version"]'
      cache-commands: '["lint:ci"]'

  prepare:
    name: Prepare
    needs: [check]
    permissions:
      contents: write
      pull-requests: write
    uses: hexadrop/github-workflows/.github/workflows/release-prepare.yml@v1.7.2
    with:
      base-branch: main
      version-command: bun run version
