delete_scheduled_transaction:
  name: Delete scheduled transaction
  description: Delete a scheduled transaction. Transactions it already posted remain.
  fields:
    entry_id:
      name: Config entry
      description: Fin Assist integration entry that owns the scheduled transaction.
      required: true
      selector:
        config_entry:
          integration: ha_finassists
    scheduled_transaction_id:
      name: Scheduled transaction ID
      description: Identifier of the scheduled transaction to delete.
      required: true
      example: 0f8fad5b-d9cb-469f-a165-70867728950e
      selector:
        text:
post_scheduled_transaction:
  name: Post scheduled transaction
  description: Post the next due occurrence of a scheduled transaction.
  fields:
    entry_id:
      name: Config entry
      description: Fin Assist integration entry that owns the scheduled transaction.
      required: true
      selector:
        config_entry:
          integration: ha_finassists
    scheduled_transaction_id:
      name: Scheduled transaction ID
      description: Identifier of the scheduled transaction to post.
      required: true
      example: 0f8fad5b-d9cb-469f-a165-70867728950e
      selector:
        text:
skip_scheduled_transaction:
  name: Skip scheduled transaction
  description: Skip the next due occurrence without recording a transaction.
  fields:
    entry_id:
      name: Config entry
      description: Fin Assist integration entry that owns the scheduled transaction.
      required: true
      selector:
        config_entry:
          integration: ha_finassists
    scheduled_transaction_id:
      name: Scheduled transaction ID
      description: Identifier of the scheduled transaction to skip.
      required: true
      example: 0f8fad5b-d9cb-469f-a165-70867728950e
      selector:
        text:
